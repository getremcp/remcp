name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      repair_release:
        description: "Repair npm/GitHub publication for an already-tagged partial release"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release tags must point at public main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          test "$head_sha" = "$main_sha" || {
            echo "release tag $GITHUB_REF_NAME points at $head_sha, but public main is $main_sha" >&2
            exit 1
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Scan git history for committed secrets
        run: bash scripts/check-secrets.sh
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Verify Linux installed-app inventory contract
        env:
          REMCP_LIVE_INSTALLED_APPS: "1"
        run: node --import ./packages/runtime/test/setup.mjs --test ./packages/runtime/test/installed-apps-live.test.mjs
      - run: npm audit --omit=dev
      - name: Inspect the exact npm package contents
        run: |
          npm pack --workspace packages/runtime --dry-run
          npm pack --workspace packages/client --dry-run
      - name: Every package version agrees
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(node -p "require('./package.json').version")"
          for manifest in plugin.json packages/client/package.json packages/runtime/package.json; do
            test "$version" = "$(node -p "require('./$manifest').version")" || { echo "$manifest is not at $version" >&2; exit 1; }
          done
          echo "all packages are at $version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version" || { echo 'release tag does not match package version' >&2; exit 1; }
          fi
      - name: Verify release title and changes match this immutable package version
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/release-details.mjs "$version" title >/dev/null
          node scripts/release-details.mjs "$version" notes >/dev/null
      - name: The advertised tool contract is real
        shell: bash
        run: |
          set -Eeuo pipefail
          count="$(node packages/runtime/src/index.mjs --print-tools | node -e 'let raw="";process.stdin.on("data",c=>raw+=c).on("end",()=>console.log(JSON.parse(raw).length))')"
          echo "runtime tools: $count"
          test "$count" -ge 20
      - name: The contract commands work with no dependencies installed
        shell: bash
        run: |
          set -Eeuo pipefail
          bare="$(mktemp -d)"
          cp -r packages/runtime/src "$bare/src"
          cp packages/runtime/package.json "$bare/package.json"
          (cd "$bare" && node src/index.mjs --describe >/dev/null && node src/index.mjs --print-tools >/dev/null)
          echo "bare-metadata ok"

  macos-documents:
    name: macOS runtime backends
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify macOS document capabilities and OOXML backend
        run: >-
          node --import ./packages/runtime/test/setup.mjs --test
          --test-name-pattern='P3 document toolset|XLSX can be created|DOCX can be created'
          ./packages/runtime/test/computer-documents.test.mjs
      - name: Verify macOS network diagnostics backend
        run: node --import ./packages/runtime/test/setup.mjs --test ./packages/runtime/test/macos-network.test.mjs
      - name: Verify macOS launchd service scope backend
        run: node --import ./packages/runtime/test/setup.mjs --test ./packages/runtime/test/macos-service.test.mjs
      - name: Verify macOS installed-app inventory contract
        env:
          REMCP_LIVE_INSTALLED_APPS: "1"
        run: node --import ./packages/runtime/test/setup.mjs --test ./packages/runtime/test/installed-apps-live.test.mjs
      - name: Verify macOS archive backend round trip
        run: >-
          node --import ./packages/runtime/test/setup.mjs --test
          --test-name-pattern='archives can be created and extracted|archive creation passes option-like member names'
          ./packages/runtime/test/tools-extended.test.mjs

  windows-installer:
    name: Windows PowerShell installer
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify Windows and NVIDIA hardware temperature source contracts
        shell: powershell
        run: node --test packages/runtime/test/temperature-inventory.test.mjs
      - name: Probe actual Windows temperature APIs without requiring physical sensors on CI
        shell: powershell
        run: node --test packages/runtime/test/windows-temperature-live.test.mjs
      - name: Verify Windows document capabilities and built-in OOXML backend
        shell: powershell
        run: >-
          node --import ./packages/runtime/test/setup.mjs --test
          --test-name-pattern='P3 document toolset|XLSX can be created|DOCX can be created'
          ./packages/runtime/test/computer-documents.test.mjs
      - name: Verify Windows CoreAudio interop compiles
        shell: powershell
        run: node --import ./packages/runtime/test/setup.mjs --test ./packages/runtime/test/windows-audio.test.mjs
      - name: Verify Windows installed-app inventory contract
        shell: powershell
        env:
          REMCP_LIVE_INSTALLED_APPS: "1"
        run: node --import ./packages/runtime/test/setup.mjs --test ./packages/runtime/test/installed-apps-live.test.mjs
      - name: Verify Windows archive backend round trip
        shell: powershell
        run: >-
          node --import ./packages/runtime/test/setup.mjs --test
          --test-name-pattern='archives can be created and extracted|ZIP archives can be created and extracted|archive creation passes option-like member names'
          ./packages/runtime/test/tools-extended.test.mjs
      - name: Parse and validate with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          & .\install.ps1 -ValidateOnly
      - name: Validate with PowerShell 7
        shell: pwsh
        run: .\install.ps1 -ValidateOnly
      - name: Smoke-test private Windows bootstrap and Scheduled Task
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $system32 = Join-Path $env:SystemRoot 'System32'
          $powershellDir = Join-Path $system32 'WindowsPowerShell\v1.0'
          $env:Path = "$system32;$env:SystemRoot;$powershellDir"
          foreach ($command in @('node.exe', 'npm.cmd', 'npx.cmd', 'winget.exe')) {
            if (Get-Command $command -ErrorAction SilentlyContinue) {
              throw "$command unexpectedly remains available before the bootstrap"
            }
          }

          $root = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'ReMCP'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          $env:REMCP_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'remcp-windows-service-test'
          Remove-Item -LiteralPath $env:REMCP_CONFIG_DIR -Recurse -Force -ErrorAction SilentlyContinue

          function Invoke-ExpectedPairingFailure {
            $failedAtPairing = $false
            try {
              & .\install.ps1 -Code 'REMCP-CI-INVALID-CODE'
            } catch {
              $message = [string]$_.Exception.Message
              Write-Host "Expected post-install pairing failure: $message"
              if ($message -match 'Pairing failed') { $failedAtPairing = $true }
              $global:LASTEXITCODE = 0
            }
            if (!$failedAtPairing) {
              throw 'The bootstrap did not reach the expected pairing boundary after installation.'
            }
          }

          try {
            Invoke-ExpectedPairingFailure

            $runtimeDir = Join-Path $root 'runtime'
            $binDir = Join-Path $root 'bin'
            $node = Join-Path $runtimeDir 'node.exe'
            $npm = Join-Path $runtimeDir 'npm.cmd'
            $runtimeCli = Join-Path $runtimeDir 'remcp.cmd'
            $wrapper = Join-Path $binDir 'remcp.cmd'
            foreach ($path in @($node, $npm, $runtimeCli, $wrapper)) {
              if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Expected bootstrap artifact is missing: $path"
              }
            }

            $nodeVersion = (& $node -p 'process.versions.node').Trim()
            if ($LASTEXITCODE -ne 0 -or $nodeVersion -ne '22.23.3') {
              throw "Private Node runtime mismatch: expected=22.23.3 actual=$nodeVersion"
            }

            # The installer already checked the official release metadata before pairing.
            # Avoid a second gated HTTP read: updates can be paused after installation.
            $clientManifest = Join-Path $runtimeDir 'node_modules\@remcp\remcp\package.json'
            $runtimeManifest = Join-Path $runtimeDir 'node_modules\@remcp\runtime\package.json'
            $expectedVersion = [string]((Get-Content -LiteralPath $clientManifest -Raw | ConvertFrom-Json).version)
            $installedRuntimeVersion = [string]((Get-Content -LiteralPath $runtimeManifest -Raw | ConvertFrom-Json).version)
            if ($expectedVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$' -or
                $installedRuntimeVersion -ne $expectedVersion) {
              throw "Installed package version mismatch: client=$expectedVersion runtime=$installedRuntimeVersion"
            }
            $runtimeVersion = (& $runtimeCli --version).Trim()
            $wrapperVersion = (& $wrapper --version).Trim()
            if ($runtimeVersion -ne $expectedVersion) {
              throw "Private CLI version mismatch: expected=$expectedVersion actual=$runtimeVersion"
            }
            if ($wrapperVersion -ne $expectedVersion) {
              throw "Wrapper CLI version mismatch: expected=$expectedVersion actual=$wrapperVersion"
            }

            $firstNodeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $node).Hash
            Invoke-ExpectedPairingFailure
            $secondNodeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $node).Hash
            if ($firstNodeHash -ne $secondNodeHash) {
              throw 'A second bootstrap unexpectedly replaced an already-valid private Node runtime.'
            }
            if (Test-Path -LiteralPath "$runtimeDir.old") {
              throw 'A successful bootstrap left a stale runtime rollback directory.'
            }

            $serviceModule = (Resolve-Path '.\packages\client\src\cli\service.mjs').Path
            if (!(Test-Path -LiteralPath $serviceModule -PathType Leaf)) {
              throw "Candidate service module is missing: $serviceModule"
            }
            $serviceModuleUri = ([Uri]$serviceModule).AbsoluteUri
            $supervisorModule = (Resolve-Path '.\packages\client\src\cli\windows-user-supervisor.mjs').Path
            $supervisorModuleUri = ([Uri]$supervisorModule).AbsoluteUri
            $launcherModule = (Resolve-Path '.\packages\client\src\cli\windows-supervisor.mjs').Path
            $launcherModuleUri = ([Uri]$launcherModule).AbsoluteUri
            $probe = Join-Path $env:RUNNER_TEMP 'remcp-windows-service-probe.mjs'
            @"
          import {
            configureWindowsWriteAccess,
            installWindowsService,
            persistentServiceState
          } from '$serviceModuleUri';
          import { windowsSupervisorCommand } from '$supervisorModuleUri';

          import fs from 'node:fs';
          import path from 'node:path';
          import { windowsStartupScriptText } from '$launcherModuleUri';

          const cliPath = process.argv[2];
          const nodePath = process.argv[3];
          const runtimeDir = path.dirname(nodePath);
          const installedSupervisor = path.join(runtimeDir, 'node_modules', '@remcp', 'remcp',
            'src', 'cli', 'windows-user-supervisor.mjs');
          const installedCliEntry = path.join(runtimeDir, 'node_modules', '@remcp', 'remcp', 'bin', 'remcp.mjs');
          const startupFixture = path.join(process.env.RUNNER_TEMP, 'remcp-windows-startup-qa.vbs');
          // Validate the *exact* protected user-Startup template even if this
          // runner cannot create a user desktop session.
          fs.writeFileSync(startupFixture,
            '\uFEFF' + windowsStartupScriptText(nodePath, installedSupervisor, installedCliEntry),
            { encoding: 'utf16le' });
          let launchMode = 'interactive-wsh';
          try {
            installWindowsService(cliPath, { nodePath });
            const state = persistentServiceState({ serviceInstalled: true,
              serviceCliPath: cliPath, serviceNodePath: nodePath });
            if (!state.installed || state.manager !== 'startup-user') {
              throw new Error('Hidden Startup manager was not registered: ' + JSON.stringify(state));
            }
          } catch (error) {
            if (process.env.GITHUB_ACTIONS !== 'true' ||
                !String(error.message || '').includes('Supervisor did not start')) throw error;
            // The hosted CI runner runs without a signed-in interactive user:
            // WScript.Shell.Run cannot prove an interactive-session launch.
            // Accept only an explicit *failed-closed* startup, with no manager
            // registration. Test the real Node/named-pipe control separately.
            const startup = path.join(process.env.APPDATA, 'Microsoft', 'Windows',
              'Start Menu', 'Programs', 'Startup', 'ReMCP Agent.vbs');
            if (fs.existsSync(startup)) throw new Error('Failed WSH launch left a false-success startup entry');
            launchMode = 'hosted-headless-wsh-denied';
          }
          if (launchMode === 'interactive-wsh') {
            const live = windowsSupervisorCommand('wait');
            if (live.running !== true || !live.childPid || live.uptimeMs < 700) {
              throw new Error('Windows interactive Startup supervisor not ready: ' + JSON.stringify(live));
            }
          }
          configureWindowsWriteAccess();
          console.log('WINDOWS_SUPERVISOR_E2E mode=' + launchMode);
          "@ | Set-Content -LiteralPath $probe -Encoding UTF8

            & $node $probe $runtimeCli $node
            if ($LASTEXITCODE -ne 0) {
              throw "Hidden Startup supervisor probe failed with exit code $LASTEXITCODE."
            }

            # GH-hosted runners have no logged-in user desktop for WSH.
            # Prove the real authenticated named-pipe/owned-child lifecycle in
            # a separate asynchronous native Windows test (never fake readiness).
            & $node --test '.\packages\client\test\windows-user-supervisor-control.test.mjs'
            if ($LASTEXITCODE -ne 0) {
              throw 'Native Windows supervisor IPC and owned-child lifecycle failed.'
            }

            # The 0.2.212 installer deliberately avoids a visible interactive
            # .cmd Scheduled Task for a *fresh* installation. Never relax this
            # into blindly accepting two simultaneous service managers.
            # The PowerShell 5.1 host treats stderr from a missing schtasks
            # entry as a terminating NativeCommandError under Stop. Query the
            # scheduler directly and only accept known task-not-found HRESULTs;
            # an ACL denial or COM failure is never evidence of absence.
            $scheduleService = New-Object -ComObject 'Schedule.Service'
            $scheduleService.Connect()
            try {
              $null = $scheduleService.GetFolder('\').GetTask('ReMCP Agent')
              throw 'Fresh Windows bootstrap unexpectedly created a visible Scheduled Task.'
            } catch {
              $exception = $_.Exception
              $missing = $false
              while ($null -ne $exception) {
                if ($exception.HResult -eq -2147024894 -or
                    $exception.HResult -eq -2147216625) {
                  $missing = $true
                  break
                }
                $exception = $exception.InnerException
              }
              if (!$missing) { throw }
            }

            $startup = Join-Path $env:RUNNER_TEMP 'remcp-windows-startup-qa.vbs'
            if (!(Test-Path -LiteralPath $startup -PathType Leaf)) {
              throw "Hidden Windows Startup launcher missing: $startup"
            }
            $bytes = @(Get-Content -LiteralPath $startup -Encoding Byte -TotalCount 2)
            if ($bytes.Count -ne 2 -or $bytes[0] -ne 255 -or $bytes[1] -ne 254) {
              throw 'Hidden launcher must preserve the Unicode BOM for international profile names.'
            }
            $startupText = Get-Content -LiteralPath $startup -Raw -Encoding Unicode
            if (!$startupText.Contains("' ReMCP managed user startup (do not edit)") -or
                !$startupText.Contains('CreateObject("WScript.Shell")') -or
                !$startupText.Contains(', 0, False')) {
              throw 'Windows Startup entry must be an owned hidden WSH launch, not a visible command window.'
            }
            $supervisor = Join-Path $runtimeDir 'node_modules\@remcp\remcp\src\cli\windows-user-supervisor.mjs'
            $cliEntry = Join-Path $runtimeDir 'node_modules\@remcp\remcp\bin\remcp.mjs'
            foreach ($entry in @($node, $supervisor, $cliEntry)) {
              if (!(Test-Path -LiteralPath $entry -PathType Leaf) -or
                  !$startupText.Contains($entry)) {
                throw "Hidden Startup launcher is not pinned to its private runtime: $entry"
              }
            }
            Write-Host "Windows bootstrap E2E OK: private Node $nodeVersion, ReMCP $runtimeVersion, verified hidden-launch template and authenticated supervisor, no competing Scheduled Task."
          } finally {
            # Stop the exact owned supervisor before removing the Startup entry.
            # The test must not leave an agent behind on a reused runner.
            if ($node -and $serviceModuleUri -and (Test-Path -LiteralPath $node)) {
              try {
                $cleanup = Join-Path $env:RUNNER_TEMP 'remcp-windows-supervisor-cleanup.mjs'
                @"
          import { uninstallPersistentService } from '$serviceModuleUri';
          import { windowsSupervisorCommand } from '$supervisorModuleUri';
          try { windowsSupervisorCommand('stop'); }
          catch (error) {
            if (!/ENOENT|ECONNREFUSED|EPIPE/.test(String(error?.message || ''))) throw error;
          }
          uninstallPersistentService();
          "@ | Set-Content -LiteralPath $cleanup -Encoding UTF8
                & $node $cleanup
                if ($LASTEXITCODE -ne 0) {
                  Write-Warning 'Windows owned-supervisor cleanup did not exit cleanly.'
                }
              } catch {
                Write-Warning ('Windows owned-supervisor cleanup failed: ' + $_.Exception.Message)
              }
            }
            try { schtasks.exe /End /TN 'ReMCP Agent' 2>$null | Out-Null } catch {}
            try { schtasks.exe /Delete /TN 'ReMCP Agent' /F 2>$null | Out-Null } catch {}
          }

  publish:
    name: publish to npm and open a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-installer, macos-documents, publish-mcp-registry]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # Trusted publishing needs npm 11.5.1 or newer; the npm bundled with Node 22 is
      # 10.9.x, which signs provenance but cannot exchange the OIDC token, so the registry
      # answers an unauthenticated PUT with 404.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install --global npm@11.5.1
          npm --version
      - name: Align npm provenance repository metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const canonical = 'git+https://github.com/getremcp/remcp.git';
          for (const file of ['packages/runtime/package.json', 'packages/client/package.json']) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!pkg.repository || typeof pkg.repository !== 'object') throw new Error(file + ' is missing repository metadata');
            pkg.repository.url = canonical;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          }
          NODE
          test "$(node -p "require('./packages/runtime/package.json').repository.url")" = 'git+https://github.com/getremcp/remcp.git'
          test "$(node -p "require('./packages/client/package.json').repository.url")" = 'git+https://github.com/getremcp/remcp.git'
      # Trusted publishing: npm exchanges the workflow's GitHub OIDC token for a
      # short-lived credential, so no NPM_TOKEN secret and no one-time password are
      # involved. Configure it once per package on npmjs.com:
      #   Package settings -> Trusted Publisher -> GitHub Actions
      #   organization/user: getremcp, repository: remcp, workflow: ci.yml
      # Re-running a failed release must be safe: an already published version is skipped
      # instead of failing the workflow with "cannot publish over the previously published
      # versions".
      - name: Publish @remcp/runtime
        run: |
          version="$(node -p "require('./packages/runtime/package.json').version")"
          if npm view "@remcp/runtime@$version" version >/dev/null 2>&1; then
            echo "@remcp/runtime@$version is already published"
          else
            npm publish --workspace packages/runtime --access public --provenance
          fi
      - name: Publish @remcp/remcp
        run: |
          version="$(node -p "require('./packages/client/package.json').version")"
          if npm view "@remcp/remcp@$version" version >/dev/null 2>&1; then
            echo "@remcp/remcp@$version is already published"
          else
            npm publish --workspace packages/client --access public --provenance
          fi
      - name: Verify the published versions resolve
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(node -p "require('./package.json').version")"
          registry_has() {
            local encoded="$1"
            curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/$encoded/$version" >/dev/null 2>&1
          }
          # Metadata can become visible before npm's CDN serves the tarball.
          # A successful npm install needs actual archive bytes, not just JSON.
          registry_archives_ready() {
            for name in runtime remcp; do
              curl --fail --silent --show-error --location --max-time 15 \
                --header 'Cache-Control: no-cache' --output /dev/null \
                "https://registry.npmjs.org/@remcp/$name/-/$name-$version.tgz" >/dev/null 2>&1 || return 1
            done
          }
          # npm trusted publishing can accept a version and then keep it in processing for several
          # minutes. Give the registry ten minutes to expose both exact versions, and bypass caches
          # so a stale 404 cannot consume the whole readiness window. Require downloadable tarballs too.
          ready=0
          for attempt in {1..60}; do
            if registry_has '@remcp%2Fruntime' && registry_has '@remcp%2Fremcp' && registry_archives_ready; then
              ready=1
              break
            fi
            if (( attempt == 1 || attempt % 6 == 0 )); then
              echo "registry is still processing $version release artifacts (attempt $attempt/60)"
            fi
            sleep 10
          done
          test "$ready" -eq 1 || {
            echo "published packages did not resolve from the registry after ten minutes" >&2
            exit 1
          }
          registry_repository() {
            local encoded="$1"
            curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/$encoded/$version" |
              node -e 'let raw="";process.stdin.on("data",c=>raw+=c).on("end",()=>console.log(JSON.parse(raw).repository?.url || ""))'
          }
          for encoded in '@remcp%2Fruntime' '@remcp%2Fremcp'; do
            actual="$(registry_repository "$encoded")"
            test "$actual" = 'git+https://github.com/getremcp/remcp.git' || {
              echo "$encoded@$version repository.url is $actual; expected canonical provenance repository" >&2
              exit 1
            }
          done
          echo "published @remcp/runtime@$version and @remcp/remcp@$version with canonical provenance metadata"
      - name: Open the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          version="$(node -p "require('./package.json').version")"
          notes="$(mktemp)"
          title="$(node scripts/release-details.mjs "$version" title)"
          {
            node scripts/release-details.mjs "$version" notes
            echo "## Packages"
            echo
            echo "- [\`@remcp/runtime@$version\`](https://www.npmjs.com/package/@remcp/runtime/v/$version) — the local device runtime"
            echo "- [\`@remcp/remcp@$version\`](https://www.npmjs.com/package/@remcp/remcp/v/$version) — the device client and outbound agent"
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "npm install --global @remcp/remcp@$version"
            echo '```'
            echo
            echo "Pairing commands are generated at https://remcp.site/app/connect."
            echo
            echo "## Tool surface"
            echo
            echo '```'
            node packages/runtime/src/index.mjs --print-tools | node -e 'let raw="";process.stdin.on("data",c=>raw+=c).on("end",()=>{for(const tool of JSON.parse(raw)) console.log(`${tool.name} — ${tool.title}`)})'
            echo '```'
            echo
            echo "Both packages are published with a signed provenance statement."
          } > "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" submission/remcp-plugin.zip submission/remcp-openai-existing-plugin.zip submission/remcp-skills-only.zip chatgpt-app-submission.json --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" submission/remcp-plugin.zip submission/remcp-openai-existing-plugin.zip submission/remcp-skills-only.zip chatgpt-app-submission.json --title "$title" --notes-file "$notes" --verify-tag
          fi


  repair-release:
    name: repair partial npm/GitHub release
    if: github.event_name == 'workflow_dispatch' && inputs.repair_release != ''
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Validate immutable repair target
        shell: bash
        env:
          REPAIR_VERSION: ${{ inputs.repair_release }}
        run: |
          set -Eeuo pipefail
          version="$REPAIR_VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "repair_release must be a plain semantic version" >&2; exit 1; }
          test "$version" = "$(node -p "require('./package.json').version")" || {
            echo "repair_release $version does not match public main package version" >&2
            exit 1
          }
          tag="v$version"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          tag_sha="$(git rev-list -n1 "$tag")"
          test -n "$tag_sha"
          git merge-base --is-ancestor "$tag_sha" HEAD || {
            echo "$tag is not an ancestor of the reviewed public main" >&2
            exit 1
          }
          unexpected="$(
            git diff --name-only "$tag_sha"..HEAD |
              grep -v -x '.github/workflows/ci.yml' || true
          )"
          test -z "$unexpected" || {
            echo "release repair refuses source drift after $tag:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          }
          echo "repairing $tag from reviewed workflow-only descendant $(git rev-parse HEAD)"
      - name: Install verified mcp-publisher 1.8.1 for recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --output /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz' | sha256sum --check
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
          /tmp/mcp-publisher --version
      - name: Validate Registry metadata for recovery
        run: /tmp/mcp-publisher validate server.json
      - name: Ensure the Registry half of the release exists
        shell: bash
        env:
          REPAIR_VERSION: ${{ inputs.repair_release }}
        run: |
          set -Eeuo pipefail
          name="$(node -p "require('./server.json').name")"
          version="$REPAIR_VERSION"
          title="$(node -p "require('./server.json').title")"
          description="$(node -p "require('./server.json').description")"
          website="$(node -p "require('./server.json').websiteUrl")"
          repository="$(node -p "require('./server.json').repository.url")"
          repository_source="$(node -p "require('./server.json').repository.source")"
          remote="$(node -p "require('./server.json').remotes[0].url")"
          remote_type="$(node -p "require('./server.json').remotes[0].type")"
          encoded="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$name")"
          url="https://registry.modelcontextprotocol.io/v0/servers/$encoded/versions/$version"

          verify_registry() {
            local status
            status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error \
              --output /tmp/remcp-registry-repair.json --write-out '%{http_code}' "$url")" || status=000
            if [[ "$status" == 200 ]]; then
              node - "$name" "$version" "$title" "$description" "$website" "$repository" "$repository_source" "$remote" "$remote_type" <<'NODE'
          const fs = require('node:fs');
          const [name, version, title, description, website, repository, repositorySource, remote, remoteType] = process.argv.slice(2);
          const record = JSON.parse(fs.readFileSync('/tmp/remcp-registry-repair.json', 'utf8'));
          const server = record.server || {};
          const official = record._meta?.['io.modelcontextprotocol.registry/official'];
          if (server.name !== name || server.version !== version || server.title !== title || server.description !== description
            || server.websiteUrl !== website || server.repository?.url !== repository || server.repository?.source !== repositorySource
            || !Array.isArray(server.remotes) || server.remotes.length !== 1
            || server.remotes[0]?.url !== remote || server.remotes[0]?.type !== remoteType
            || official?.status !== 'active' || official?.isLatest !== true) {
            throw new Error('Registry recovery record does not exactly match the immutable release: ' + JSON.stringify(record));
          }
          NODE
              return $?
            fi
            if [[ "$status" == 404 || "$status" == 000 || "$status" =~ ^5 ]]; then
              return 1
            fi
            cat /tmp/remcp-registry-repair.json >&2 || true
            echo "Registry recovery probe failed with HTTP $status" >&2
            return 2
          }

          set +e
          verify_registry
          verify_status=$?
          set -e
          if (( verify_status == 0 )); then
            echo "MCP Registry release already exists and matches: $name@$version"
            exit 0
          fi
          if (( verify_status == 2 )); then exit 1; fi

          for attempt in 1 2 3; do
            echo "Registry publish recovery attempt $attempt/3 for $name@$version"
            /tmp/mcp-publisher login github-oidc
            set +e
            /tmp/mcp-publisher publish server.json
            publish_status=$?
            set -e

            for visibility in {1..12}; do
              set +e
              verify_registry
              verify_status=$?
              set -e
              if (( verify_status == 0 )); then
                if (( publish_status != 0 )); then
                  echo "Registry publish returned an error, but the exact release became visible and valid."
                fi
                exit 0
              fi
              if (( verify_status == 2 )); then exit 1; fi
              sleep 5
            done

            if (( attempt < 3 )); then
              sleep $((attempt * 10))
            fi
          done
          echo "MCP Registry release is still absent after bounded recovery attempts" >&2
          exit 1
      - run: npm ci --no-audit --no-fund
      - name: Use an npm that supports trusted publishing
        run: |
          npm install --global npm@11.5.1
          npm --version
      - name: Align npm provenance repository metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const canonical = 'git+https://github.com/getremcp/remcp.git';
          for (const file of ['packages/runtime/package.json', 'packages/client/package.json']) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!pkg.repository || typeof pkg.repository !== 'object') throw new Error(file + ' is missing repository metadata');
            pkg.repository.url = canonical;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          }
          NODE
      - name: Publish missing npm packages
        shell: bash
        env:
          REPAIR_VERSION: ${{ inputs.repair_release }}
        run: |
          set -Eeuo pipefail
          version="$REPAIR_VERSION"
          if npm view "@remcp/runtime@$version" version >/dev/null 2>&1; then
            echo "@remcp/runtime@$version is already published"
          else
            npm publish --workspace packages/runtime --access public --provenance
          fi
          if npm view "@remcp/remcp@$version" version >/dev/null 2>&1; then
            echo "@remcp/remcp@$version is already published"
          else
            npm publish --workspace packages/client --access public --provenance
          fi
      - name: Verify repaired npm packages resolve with canonical provenance metadata
        shell: bash
        env:
          REPAIR_VERSION: ${{ inputs.repair_release }}
        run: |
          set -Eeuo pipefail
          version="$REPAIR_VERSION"
          registry_has() {
            local encoded="$1"
            curl --fail --silent --show-error --header 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/$encoded/$version" >/dev/null 2>&1
          }
          # Metadata can become visible before npm's CDN serves the tarball.
          # A successful npm install needs actual archive bytes, not just JSON.
          registry_archives_ready() {
            for name in runtime remcp; do
              curl --fail --silent --show-error --location --max-time 15 \
                --header 'Cache-Control: no-cache' --output /dev/null \
                "https://registry.npmjs.org/@remcp/$name/-/$name-$version.tgz" >/dev/null 2>&1 || return 1
            done
          }
          for attempt in {1..60}; do
            if registry_has '@remcp%2Fruntime' && registry_has '@remcp%2Fremcp' && registry_archives_ready; then
              break
            fi
            if (( attempt == 60 )); then
              echo "repaired npm packages did not resolve after ten minutes" >&2
              exit 1
            fi
            sleep 10
          done
          registry_repository() {
            local encoded="$1"
            curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/$encoded/$version" |
              node -e 'let raw="";process.stdin.on("data",c=>raw+=c).on("end",()=>console.log(JSON.parse(raw).repository?.url || ""))'
          }
          for encoded in '@remcp%2Fruntime' '@remcp%2Fremcp'; do
            actual="$(registry_repository "$encoded")"
            test "$actual" = 'git+https://github.com/getremcp/remcp.git' || {
              echo "$encoded@$version repository.url is $actual; expected canonical provenance repository" >&2
              exit 1
            }
          done
      - name: Open or repair the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_VERSION: ${{ inputs.repair_release }}
        run: |
          set -Eeuo pipefail
          version="$REPAIR_VERSION"
          tag="v$version"
          notes="$(mktemp)"
          title="$(node scripts/release-details.mjs "$version" title)"
          {
            node scripts/release-details.mjs "$version" notes
            echo "## Packages"
            echo
            echo "- [\`@remcp/runtime@$version\`](https://www.npmjs.com/package/@remcp/runtime/v/$version) — the local device runtime"
            echo "- [\`@remcp/remcp@$version\`](https://www.npmjs.com/package/@remcp/remcp/v/$version) — the device client and outbound agent"
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "npm install --global @remcp/remcp@$version"
            echo '```'
            echo
            echo "Pairing commands are generated at https://remcp.site/app/connect."
            echo
            echo "## Tool surface"
            echo
            echo '```'
            node packages/runtime/src/index.mjs --print-tools | node -e 'let raw="";process.stdin.on("data",c=>raw+=c).on("end",()=>{for(const tool of JSON.parse(raw)) console.log(`${tool.name} — ${tool.title}`)})'
            echo '```'
            echo
            echo "Both packages are published with a signed provenance statement."
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" submission/remcp-plugin.zip submission/remcp-openai-existing-plugin.zip submission/remcp-skills-only.zip chatgpt-app-submission.json --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes"
          else
            gh release create "$tag" submission/remcp-plugin.zip submission/remcp-openai-existing-plugin.zip submission/remcp-skills-only.zip chatgpt-app-submission.json \
              --title "$title" --notes-file "$notes" --verify-tag
          fi

  publish-mcp-registry:
    name: publish to official MCP Registry
    # Manual CI is validation-only. Registry publishing is a release side effect and only
    # belongs to immutable v* tags.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-installer, macos-documents]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified mcp-publisher 1.8.1
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --output /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz' | sha256sum --check
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
          /tmp/mcp-publisher --version
      - name: Validate registry metadata
        run: /tmp/mcp-publisher validate server.json
      - name: Check MCP Registry publication state
        id: registry-preflight
        shell: bash
        run: |
          set -Eeuo pipefail
           name="$(node -p "require('./server.json').name")"
           version="$(node -p "require('./server.json').version")"
           title="$(node -p "require('./server.json').title")"
           description="$(node -p "require('./server.json').description")"
           website="$(node -p "require('./server.json').websiteUrl")"
           repository="$(node -p "require('./server.json').repository.url")"
           repository_source="$(node -p "require('./server.json').repository.source")"
           remote="$(node -p "require('./server.json').remotes[0].url")"
           remote_type="$(node -p "require('./server.json').remotes[0].type")"
           encode() { node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$1"; }
           verify_record() {
             node - "$1" "$2" "$3" "$4" "$5" "$6" "$7" "$8" "$9" <<'NODE'
          const fs = require('node:fs');
          const [name, version, title, description, website, repository, repositorySource, remote, remoteType] = process.argv.slice(2);
          const record = JSON.parse(fs.readFileSync('/tmp/remcp-registry-current.json', 'utf8'));
          const server = record.server || {};
          const official = record._meta?.['io.modelcontextprotocol.registry/official'];
          if (server.name !== name || server.version !== version || server.title !== title || server.description !== description
            || server.websiteUrl !== website || server.repository?.url !== repository || server.repository?.source !== repositorySource
            || !Array.isArray(server.remotes) || server.remotes.length !== 1
            || server.remotes[0]?.url !== remote || server.remotes[0]?.type !== remoteType
            || official?.status !== 'active' || official?.isLatest !== true) {
            throw new Error(`Registry record does not match local metadata or is not active/latest: ${JSON.stringify(record)}`);
          }
          NODE
          }


          encoded="$(encode "$name")"
          current_url="https://registry.modelcontextprotocol.io/v0/servers/$encoded/versions/$version"
          # Retry transient Registry transport failures (including curl 28); never treat them as 404.
          current_status="$(curl --connect-timeout 5 --max-time 20 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 100 --silent --show-error --output /tmp/remcp-registry-current.json --write-out '%{http_code}' "$current_url")"
          if [[ "$current_status" == 200 ]]; then
             verify_record "$name" "$version" "$title" "$description" "$website" "$repository" "$repository_source" "$remote" "$remote_type"

          elif [[ "$current_status" != 404 ]]; then
            cat /tmp/remcp-registry-current.json >&2 || true
            echo "Registry preflight failed with HTTP $current_status" >&2
            exit 1
          fi

          # The legacy antonbaider Registry identity was retired during the namespace
          # migration to getremcp. If it ever reappears for the same production remote,
          # fail closed: a green release must never mean that Registry publication was skipped.
          legacy_name='io.github.antonbaider/remcp'
          if [[ "$name" == 'io.github.getremcp/remcp' ]]; then
            legacy_encoded="$(encode "$legacy_name")"
            legacy_url="https://registry.modelcontextprotocol.io/v0/servers/$legacy_encoded/versions/latest"
            legacy_status="$(curl --connect-timeout 5 --max-time 20 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 100 --silent --show-error --output /tmp/remcp-registry-legacy.json --write-out '%{http_code}' "$legacy_url")"
            if [[ "$legacy_status" == 200 ]]; then
              legacy_remote="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/remcp-registry-legacy.json','utf8'));process.stdout.write(x.server?.remotes?.[0]?.url||'')")"
              if [[ "$legacy_remote" == "$remote" ]]; then
                cat /tmp/remcp-registry-legacy.json >&2 || true
                echo "Legacy Registry identity $legacy_name unexpectedly owns $remote; refusing to report a successful release without publishing $name@$version." >&2
                exit 1
              fi
            elif [[ "$legacy_status" != 404 ]]; then
              cat /tmp/remcp-registry-legacy.json >&2 || true
              echo "Legacy Registry preflight failed with HTTP $legacy_status" >&2
              exit 1
            fi
          fi

          if [[ "$current_status" == 200 ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already present and matches the Official MCP Registry"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with GitHub Actions OIDC
        if: steps.registry-preflight.outputs.publish == 'true'
        run: /tmp/mcp-publisher login github-oidc
      - name: Publish current ReMCP version with bounded retry
        if: steps.registry-preflight.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          name="$(node -p "require('./server.json').name")"
          version="$(node -p "require('./server.json').version")"
          encoded="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$name")"
          url="https://registry.modelcontextprotocol.io/v0/servers/$encoded/versions/$version"

          for attempt in 1 2 3; do
            echo "Registry publish attempt $attempt/3 for $name@$version"
            if (( attempt > 1 )); then
              /tmp/mcp-publisher login github-oidc
            fi
            set +e
            /tmp/mcp-publisher publish server.json
            publish_status=$?
            set -e
            if (( publish_status == 0 )); then
              exit 0
            fi

            # A Registry write can succeed server-side even when the client sees a timeout.
            # Probe the immutable version before retrying so a 504 cannot create a duplicate publish.
            status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error \
              --output /tmp/remcp-registry-after-publish.json --write-out '%{http_code}' "$url")" || status=000
            if [[ "$status" == 200 ]]; then
              echo "Registry publish returned an error, but $name@$version is visible; continuing to the exact metadata verifier."
              exit 0
            fi
            if [[ "$status" != 404 && "$status" != 000 && ! "$status" =~ ^5 ]]; then
              cat /tmp/remcp-registry-after-publish.json >&2 || true
              echo "Registry post-publish probe failed with HTTP $status" >&2
              exit 1
            fi
            if (( attempt < 3 )); then
              sleep $((attempt * 10))
            fi
          done
          echo "MCP Registry publish failed after 3 bounded attempts" >&2
          exit 1
      - name: Verify published MCP Registry version
        if: steps.registry-preflight.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
           name="$(node -p "require('./server.json').name")"
           version="$(node -p "require('./server.json').version")"
           title="$(node -p "require('./server.json').title")"
           description="$(node -p "require('./server.json').description")"
           website="$(node -p "require('./server.json').websiteUrl")"
           repository="$(node -p "require('./server.json').repository.url")"
           repository_source="$(node -p "require('./server.json').repository.source")"
           remote="$(node -p "require('./server.json').remotes[0].url")"
           remote_type="$(node -p "require('./server.json').remotes[0].type")"
           encoded="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$name")"
           url="https://registry.modelcontextprotocol.io/v0/servers/$encoded/versions/$version"
           for attempt in {1..30}; do
             status="$(curl --connect-timeout 5 --max-time 20 --retry 2 --retry-all-errors --retry-delay 2 --retry-max-time 70 --silent --show-error --output /tmp/remcp-registry-published.json --write-out '%{http_code}' "$url")" || status=000
             if [[ "$status" == 200 ]]; then
               node - "$name" "$version" "$title" "$description" "$website" "$repository" "$repository_source" "$remote" "$remote_type" <<'NODE'
          const fs = require('node:fs');
          const [name, version, title, description, website, repository, repositorySource, remote, remoteType] = process.argv.slice(2);
          const record = JSON.parse(fs.readFileSync('/tmp/remcp-registry-published.json', 'utf8'));
          const server = record.server || {};
          const official = record._meta?.['io.modelcontextprotocol.registry/official'];
          if (server.name !== name || server.version !== version || server.title !== title || server.description !== description
            || server.websiteUrl !== website || server.repository?.url !== repository || server.repository?.source !== repositorySource
            || !Array.isArray(server.remotes) || server.remotes.length !== 1
            || server.remotes[0]?.url !== remote || server.remotes[0]?.type !== remoteType
            || official?.status !== 'active' || official?.isLatest !== true) {
            throw new Error(`Published Registry record is invalid: ${JSON.stringify(record)}`);
          }
          NODE
              echo "MCP Registry publication verified: $name@$version"
              exit 0
            fi

            [[ "$status" == 404 ]] || { cat /tmp/remcp-registry-published.json >&2 || true; exit 1; }
            sleep 10
          done
          echo "MCP Registry publication did not become visible in time" >&2
          exit 1