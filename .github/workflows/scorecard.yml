# Generated release-only workflow. The source of truth is
# antonbaider/remcp-full:docs/public-repo-scorecard.yml.
# Keep permissions scoped to this single public-repository analysis job.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions: read-all

jobs:
  scorecard:
    name: OpenSSF Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      security-events: write
      id-token: write
    steps:
      - name: Check out public release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Evaluate and publish Scorecard results
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload security findings to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          sarif_file: scorecard-results.sarif
