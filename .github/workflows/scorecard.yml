# Generated release-only workflow. The source of truth is
# antonbaider/remcp-full:docs/public-repo-scorecard.yml.
# Keep publish permissions scoped to Scorecard; verification uses read-only access.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions: read-all

jobs:
  scorecard:
    name: OpenSSF Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      security-events: write
      id-token: write
    steps:
      - name: Check out public release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Evaluate and publish Scorecard results
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload security findings to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard-results.sarif
  verify-publication:
    name: Verify public Scorecard result was actually published
    needs: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require Scorecard API to report this exact commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          api="https://api.scorecard.dev/projects/github.com/${EXPECTED_REPO}"
          for attempt in $(seq 1 20); do
            payload="$(curl --silent --fail --max-time 8 "$api" || true)"
            if [[ -n "$payload" ]]; then
              actual_sha="$(printf '%s' "$payload" | jq -r '.repo.commit // empty')"
              actual_repo="$(printf '%s' "$payload" | jq -r '.repo.name // empty')"
              if [[ "$actual_sha" == "$EXPECTED_SHA" && "$actual_repo" == "github.com/$EXPECTED_REPO" ]]; then
                echo "OpenSSF Scorecard published for $actual_repo at $actual_sha"
                exit 0
              fi
            fi
            sleep 6
          done
          echo "OpenSSF Scorecard was not published for current commit $EXPECTED_SHA" >&2
          exit 1
